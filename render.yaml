# Render Blueprint — deploy LGCY Core as a free 24/7 web service.
# In Render: New + → Blueprint → pick the lgcy-core repo → Apply.
# It auto-creates the service with everything below; you only add DISCORD_TOKEN.
services:
  - type: web
    name: lgcy-core
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    envVars:
      # The ONE secret — set it in the Render dashboard (sync:false = not in git).
      - key: DISCORD_TOKEN
        sync: false
      - key: DISCORD_CLIENT_ID
        value: "1551593131877732513"
      - key: GUILD_ID
        value: "1534980236305891408"
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "24"
      # Channel seeds — restore welcome config after Render's disk resets.
      - key: WELCOME_CHANNEL_ID
        value: "1534981703393611907"
      - key: RULES_CHANNEL_ID
        value: "1534981713300685024"
      - key: ROLES_CHANNEL_ID
        value: "1550673783097139261"
      # Logging destinations per category (سجل-* channels + Decisions).
      - key: LOG_MEMBER_CHANNEL_ID
        value: "1534981638516248667"
      - key: LOG_MESSAGE_CHANNEL_ID
        value: "1534981635311800421"
      - key: LOG_ROLE_CHANNEL_ID
        value: "1534981660444069969"
      - key: LOG_VOICE_CHANNEL_ID
        value: "1534981657159929937"
      - key: LOG_SERVER_CHANNEL_ID
        value: "1534981664315408485"
      - key: LOG_MODERATION_CHANNEL_ID
        value: "1534981678848671926"
